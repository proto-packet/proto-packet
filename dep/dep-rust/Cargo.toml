[workspace]
resolver = "3"
members = [
    "proto-packet",
]

[workspace.package]
version = "0.0.0"
repository = "https://github.com/proto-packet/proto-packet"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", features = ["serde"] }
