[package]
name = "proto-packet"
description = "This library provides the dependencies for generated ProtoPacket code."
homepage = "https://github.com/proto-packet/proto-packet/tree/master/dep/dep-rust/proto-packet"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["types"]
types = ["dep:chrono", "dep:serde", "dep:uuid"]
service = ["types", "dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
