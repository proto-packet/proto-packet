[workspace]
resolver = "3"
members = [
    "proto-packet-cli",
    "proto-packet-compile",
    "proto-packet-gen",
    "proto-packet-link",
    "proto-packet-parse",
    "proto-packet-tree",
    "proto-packet-validate",
]

[workspace.package]
version = "0.0.0"
repository = "https://github.com/proto-packet/proto-packet"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
module_inception = "allow"

[workspace.dependencies]
proto-packet = { path = "../dep/dep-rust/proto-packet", default-features = false } # todo -- path dependency
proto-packet-compile = { path = "proto-packet-compile" } # todo -- path dependency
proto-packet-gen = { path = "proto-packet-gen" } # todo -- path dependency
proto-packet-link = { path = "proto-packet-link" } # todo -- path dependency
proto-packet-parse = { path = "proto-packet-parse" } # todo -- path dependency
proto-packet-tree = { path = "proto-packet-tree" } # todo -- path dependency
proto-packet-validate = { path = "proto-packet-validate" } # todo -- path dependency

clap = "4.6.7"
clerr = "0.11.1"
code-gen = "0.12.0"
custom-string = "0.11.0-rc.2" # todo -- release candidate
lex = "0.16.0"
serde = "1.0.229"
serde_json = "1.0.154"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
