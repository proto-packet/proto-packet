[workspace]
resolver = "3"
members = [
    "proto-packet-cli",
    "proto-packet-compile",
    "proto-packet-gen",
    "proto-packet-link",
    "proto-packet-parse",
    "proto-packet-tree",
    "proto-packet-validate",
]

[workspace.package]
version = "0.0.0"
repository = "https://github.com/proto-packet/proto-packet"
edition = "2024"
license = "MIT"

[workspace.dependencies]
proto-packet = { path = "../dep/dep-rust/proto-packet" } # todo -- path dependency

custom-string = "0.11.0-rc.2" # todo -- release candidate
lex = "0.16.0"
