[package]
name = "proto-packet-test"
description = "This library tests the generated ProtoPacket Rust code."
homepage = "https://github.com/proto-packet/proto-packet/tree/master/test/test-rust"
readme = "README.md"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/proto-packet/proto-packet"
publish = false

[dependencies]
proto-packet = { path = "../../dep/dep-rust", features = ["service"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
