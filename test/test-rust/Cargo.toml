[workspace]
resolver = "3"
members = [
    "proto-packet-test",
]

[workspace.package]
version = "0.0.0"
repository = "https://github.com/proto-packet/proto-packet"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
proto-packet = { path = "../../dep/dep-rust/proto-packet", features = ["service"] }

serde_json = "1.0.154"
tokio = "1.54.1"
tower = "0.5.3"
